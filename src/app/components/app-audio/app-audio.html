<div class="top-controls-panel">
        <div class="volume-control">
            <label for="bgm-volume">
                {{ 'batalla.volume.music' | translate }}: {{ (bgmVolume * 100).toFixed(0) }}%
            </label>
            <input 
                id="sfx-volume" 
                type="range" 
                min="0" 
                max="1" 
                step="0.1" 
                [value]="bgmVolume" 
                (input)="setBGMVolume($event)"
            >
        </div>
    </div>
